name: Update Polymarket history

# Refreshes polymarket_history.json from Polymarket (server-side, no CORS),
# so the dashboard's market chart always has a real, growing time series.

on:
  schedule:
    - cron: "17 6 * * *"      # daily at 06:17 UTC (~03:17 in Argentina)
  workflow_dispatch:           # also lets you run it manually from the Actions tab

permissions:
  contents: write              # allow the workflow to commit the JSON back

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Polymarket history
        run: python fetch_polymarket.py

      - name: Commit updated history (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain polymarket_history.json)" ]; then
            git add polymarket_history.json
            git commit -m "Update Polymarket history ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No change in polymarket_history.json"
          fi
