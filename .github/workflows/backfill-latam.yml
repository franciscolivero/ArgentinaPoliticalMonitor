name: Backfill Latin America history

# Run by hand (Actions → "Backfill Latin America history" → Run workflow) to rebuild the history of
# the countries with thin coverage: every past CB Global Data ranking, two years of Google News in
# two-month slices, and the full text of the articles behind those headlines.
# It can take 30–50 minutes. The daily "Update Latin America approval" keeps things current after.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latam-approval
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: OCR tools (CB Global Data prints the month's figures inside an image)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr poppler-utils
      - run: pip install requests numpy beautifulsoup4 lxml pypdf googlenewsdecoder

      - name: Rebuild history
        run: python fetch_latam_approval.py --backfill

      - name: Show run report
        if: always()
        run: cat latam_log.txt || true

      - name: Commit (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latam_approval.json latam_log.txt latam_articles_seen.json 2>/dev/null || git add latam_approval.json latam_log.txt
          if ! git diff --cached --quiet; then
            git commit -m "Backfill Latin America approval history ($(date -u +%Y-%m-%d))"
            git pull --rebase -X theirs
            git push
          else
            echo "No change"
          fi
