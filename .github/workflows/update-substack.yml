name: Substack charts and drafts

# Weekly: refreshes the Datawrapper charts embedded in the Substack posts (publish_datawrapper.py)
# and writes the two drafts for the week (draft_posts.py) into posts/. Needs the repository secret
# DATAWRAPPER_TOKEN; without it, only the CSVs and the drafts are produced.
# The charts also refresh daily, so embeds in already-published posts stay current.

on:
  schedule:
    - cron: "40 11 * * *"     # daily chart refresh, 11:40 UTC (after the data workflows)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: substack
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl

      - name: Update Datawrapper charts
        env:
          DATAWRAPPER_TOKEN: ${{ secrets.DATAWRAPPER_TOKEN }}
        run: python publish_datawrapper.py

      - name: Write this week's drafts (Fridays, or when run by hand)

        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "5" ]; then
            python draft_posts.py
          else
            echo "Drafts are written on Fridays"
          fi

      - name: Commit (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A charts_data datawrapper_charts.json posts 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Substack charts/drafts ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
          else
            echo "No change"
          fi
